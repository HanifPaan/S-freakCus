# threat_watch settings - /etc/threat_watch/threat_watch.conf
# Changes apply on the next run. Updates never overwrite this file.

# What to check: all | users | domains
SCOPE="users"
USERS=""                    # used when SCOPE="users", space separated
DOMAINS=""                  # used when SCOPE="domains", e.g. "intelli.asia shop.intelli.asia"

# Countries (2-letter codes, space separated)
WATCH="ID"                  # log everything these countries do
WHITELIST="MY"              # normal visits not logged; still logged if suspicious
WHITELIST_IPS=""            # never logged at all (your office, monitoring, this server)

# Suspicious = request matches BAD_REQUESTS, or user-agent matches BAD_AGENTS,
# or PHP_404_LIMIT or more 404s on .php pages in one run. Case-insensitive.
BAD_REQUESTS='option=com_jce|jce\.xml|/tmp/|\.(png|jpe?g|gif)(\?|%3f)\.php|/\.(git|env)|wp-login|xmlrpc|/(wso|alfa|mini|shell|up|xa)[^/ ]*\.php|eval\(|base64_decode|union(%20|\+| )+select|\.\./\.\./'
BAD_AGENTS='sqlmap|nikto|nuclei|zgrab|masscan|python-requests|go-http-client|curl/|wget/'
PHP_404_LIMIT=20

# Housekeeping
KEEP_DAYS=30                # delete reports older than this
MAX_LINES_PER_IP=30         # request lines shown per IP in a report
DOMLOGS="/usr/local/apache/domlogs"
REPO="HanifPaan/S-freakCus"  # GitHub repo used by "threat_watch update"
